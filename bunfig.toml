[install]
# Security pins for advisories that open Dependabot alerts live in the root
# package.json "overrides" field; "trustedDependencies" lists the only packages
# allowed to run install scripts.
#
# Exemptions from the minimum release age so verified fresh Pi runtime and
# chord releases stay installable. No base `minimumReleaseAge` is configured, so
# these stay inert until one is set; they carry over the pnpm workspace list.
# Entries are exact versions on purpose: a name-only entry would exempt every
# future release too.
minimumReleaseAgeExcludes = [
  "@earendil-works/chord@1.0.0",
  "@earendil-works/pi-agent-core@1.0.0",
  "@earendil-works/pi-ai@1.0.0",
  "@earendil-works/pi-codemode@1.0.0",
  "@earendil-works/pi-coding-agent@1.0.0",
  "@earendil-works/pi-mcp@1.0.0",
  "@earendil-works/pi-telemetry@1.0.0",
  "@earendil-works/pi-tui@1.0.0",
]
