packages:
  - packages/*

# Security pins for advisories that open Dependabot alerts.
# Remove a pin when every dependent raises its own range above the patched version.
overrides:
  brace-expansion: ^5.0.12
  shell-quote: ^1.11.0
  source-map-js: ^1.2.2

  # Freeze the user-selected verification cohort, including auto-installed peers.
  '@earendil-works/pi-coding-agent': 1.1.0
  '@earendil-works/pi-ai': 1.1.0
  '@earendil-works/pi-tui': 1.1.0

allowBuilds:
  "@google/genai": true
  esbuild: true
  protobufjs: true

minimumReleaseAgeExclude:
  - '@earendil-works/chord@1.1.0'
  - '@earendil-works/pi-agent-core@1.1.0'
  - '@earendil-works/pi-ai@1.1.0'
  - '@earendil-works/pi-codemode@1.1.0'
  - '@earendil-works/pi-coding-agent@1.1.0'
  - '@earendil-works/pi-mcp@1.1.0'
  - '@earendil-works/pi-telemetry@1.1.0'
  - '@earendil-works/pi-tui@1.1.0'

onlyBuiltDependencies:
  - esbuild
  - "@google/genai"
  - protobufjs
