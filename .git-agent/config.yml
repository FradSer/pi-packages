scopes:
    - name: ctx
      description: Code-context retrieval extensions and research workflows in packages/context/; does not cover package-local runtime logic.
    - name: cl
      description: Harness guardrails, memory retrieval, injection, and consolidation in packages/continual-learning/; does not cover the shared kit runtime.
    - name: kit
      description: Shared runtime, process lifecycles, and tool interfaces in packages/kit/; does not cover consumer package behavior.
    - name: tm
      description: Agent coordination, worker spawning, task-board state, and UI rendering in packages/agent-teams/; does not cover shared kit internals.
    - name: btw
      description: Read-only side-question overlay and child-session behavior in packages/btw/; does not cover other package runtimes.
    - name: key
      description: Keyboard integration, lighting state, and global session records in packages/keyboard/; does not cover other package runtimes.
    - name: mp
      description: Persisted Matt Pocock workflow routes, procedures, and command integration in packages/matt-pocock/; does not cover other package runtimes.
    - name: mon
      description: Background command monitoring, result contracts, diagnostics, and event handling in packages/monitor/; does not cover shared kit internals.
    - name: plan
      description: Planning workers, overlay management, and execution orchestration in packages/plan-mode/; does not cover general-purpose utilities.
    - name: rc
      description: Session recap generation, persistence, and display behavior in packages/recap/; does not cover other package runtimes.
    - name: sr
      description: External skill-collection routing and command behavior in packages/skill-router/; does not cover other package runtimes.
    - name: util
      description: General-purpose extensions, npm guards, sessions, and worktree utilities in packages/utils/; does not cover release automation.
    - name: vis
      description: Text-model image analysis bridging and vision model configuration in packages/vision/; does not cover other package runtimes.
    - name: rel
      description: Package manifests, Changesets, release allowlists, and publishing automation in .changeset/ and scripts/; does not cover runtime package behavior.
    - name: repo
      description: Repository-wide documentation, RFCs, contributor guidance, workspace configuration, and shared package conventions in docs/ and repository root; does not cover package-specific implementation details.
    - name: ex
      description: SDK usage examples in examples/; does not cover package implementations or release automation.
