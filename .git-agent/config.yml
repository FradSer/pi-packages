scopes:
    - name: cc
      description: code context analysis and research utilities in packages/context/; does not cover git or project-specific tools.
    - name: git
      description: git workflow automation, hooks, and commit management in packages/git/; does not cover github platform integrations.
    - name: gh
      description: github issue, pull request, and review workflows in packages/github/; does not cover core git operations.
    - name: lark
      description: lark platform integration, including drive, docs, calendar, and apps in packages/lark/; does not cover code-context or git.
    - name: mem
      description: shared memory, state management, and persistence logic in packages/memory/; does not cover application-specific skill definitions.
    - name: ga
      description: git agent hooks, extensions, and commit skills in packages/git-agent/; does not cover core git workflows
    - name: examples
      description: SDK usage example in examples/; does not cover publish automation or package implementations.
    - name: packages
      description: Published Pi extensions, skills, and integrations in packages/; does not cover repository release scripts.
    - name: scripts
      description: Release publishing automation in scripts/; does not cover package runtime behavior.
    - name: teams
      description: Agent coordination, spawner logic, and UI rendering in packages/agent-teams/; does not cover memory or kit.
    - name: kit
      description: Core runtime, process lifecycles, and shared tool interfaces in packages/pi-kit/; does not cover agent team coordination.
    - name: plan
      description: Plan-mode workers, overlay management, and execution orchestration in packages/plan-mode/; does not cover general agents.
    - name: mon
      description: System monitoring, diagnostic output, and event deduping in packages/monitor/; does not cover core pi-kit.
    - name: utils
      description: General purpose extensions, npm guards, and worktree utilities in packages/utils/; does not cover release scripts.
