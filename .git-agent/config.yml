scopes:
    - name: sdlc
      description: user intent capture and current task handoff in packages/sdlc/; does not cover context research or shared kit persistence
    - name: ctx
      description: code-context retrieval and research workflows in packages/context/; does not cover package-local runtime logic
    - name: cl
      description: harness guardrails, memory retrieval, injection, and consolidation in packages/continual-learning/; does not cover the shared kit runtime
    - name: kit
      description: shared runtime, process lifecycles, and tool interfaces in packages/kit/; does not cover consumer package behavior
    - name: tm
      description: agent team composition, peer messaging, and UI rendering in packages/agent-teams/; does not cover the subagent execution layer
    - name: sa
      description: subagent definitions, child spawn, workspace isolation, and report channels in packages/subagents/; does not cover team coordination
    - name: tasks
      description: task data model, status machines, dependency-graph rules, and durable board persistence in packages/tasks/; does not cover processes
    - name: goal
      description: durable goal runtime, ledger storage, and completion auditing in packages/goal/; does not cover shared kit internals
    - name: loop
      description: scheduled self-prompting, decision-selected loop plans, and native user-turn delivery in packages/loop/; does not cover shared kit internals
    - name: odk
      description: remote session reporting and Pi-control events to Open DeskOS in packages/open-deskos/; does not cover shared kit internals
    - name: util
      description: general-purpose extensions, live session control, and worktree utilities in packages/utils/; does not cover release automation
    - name: rel
      description: package manifests, changesets, and publishing automation in .changeset/ and scripts/; does not cover runtime package behavior
    - name: btw
      description: side conversations and overlays in packages/btw/; does not cover shared kit internals
    - name: imp
      description: interface design procedures and tooling in packages/impeccable/; does not cover shared kit internals
    - name: key
      description: keyboard interaction helpers in packages/keyboard/; does not cover shared kit internals
    - name: mp
      description: planning and interview workflows in packages/matt-pocock/; does not cover shared kit internals
    - name: mon
      description: session monitoring and activity display in packages/monitor/; does not cover shared kit internals
    - name: plan
      description: planning mode lifecycle in packages/plan-mode/; does not cover shared kit internals
    - name: recap
      description: session recaps in packages/recap/; does not cover shared kit internals
    - name: mpg
      description: magpie gateway provider, live model catalog, and refresh policy in packages/magpie/; does not cover shared kit internals
    - name: sr
      description: skill discovery and routing in packages/skill-router/; does not cover shared kit internals
    - name: vis
      description: image and visual input tools in packages/vision/; does not cover shared kit internals
    - name: ex
      description: sample scripts and usage implementations in examples/; does not cover package source code
    - name: bdd
      description: top-level Gherkin feature definitions and behavior files in features/; does not cover package features
    - name: pkgs
      description: workspace packages including agent-teams, continual-learning, and kit in packages/; does not cover root scripts or docs
    - name: tests
      description: cross-package acceptance, prompt budget, and integration test suites in tests/; does not cover package-specific tests
    - name: build
      description: build, publish, and utility automation scripts in scripts/; does not cover source packages
