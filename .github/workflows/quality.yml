name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.1"

      # Bun runs the package tests and the workspace scripts; Node is only the
      # harness for the Python-driven checks and the TypeScript test fixtures.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install pytest
        run: python3 -m pip install --disable-pip-version-check pytest pytest-xdist

      - name: Run quality gate
        run: bun run check
