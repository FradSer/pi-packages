name: Publish package to npm

on:
  push:
    tags:
      - "*@*"
  workflow_dispatch:
    inputs:
      package:
        description: "Package name to publish, e.g. @fradser/pi-memory"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve package to publish
        id: pkg
        run: |
          if [ -n "${{ github.event.inputs.package }}" ]; then
            PKG="${{ github.event.inputs.package }}"
          else
            # Tag is "<name>@<version>"; npm scoped names are the whole "@scope/name".
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ "$TAG" == @* ]]; then
              PKG="${TAG%@*}"
            else
              # Unscoped name has no dots in the version part to disambiguate, so
              # split on the LAST "@" (versions are never empty).
              PKG="${TAG%@*}"
            fi
          fi
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"
          test -d "packages/${PKG#@*/}" || test -f "package.json" || { echo "package dir not found" >&2; exit 1; }

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PKG="${{ steps.pkg.outputs.pkg }}"
          # For scoped packages the tag is "@scope/name@x.y.z" — strip the final @version.
          VER_TAG="${TAG##*@}"
          # Find the manifest version for the package.
          if [ "$PKG" = "$(node -p "require('./package.json').name")" ]; then
            VER_PKG="$(node -p "require('./package.json').version")"
          else
            VER_PKG="$(node -p "require('./packages/${PKG#@*/}/package.json').version")"
          fi
          echo "tag=$VER_TAG pkg_version=$VER_PKG"
          [ "$VER_TAG" = "$VER_PKG" ] || { echo "tag version $VER_TAG != package version $VER_PKG" >&2; exit 1; }

      - name: Publish to npm
        run: pnpm publish --filter "${{ steps.pkg.outputs.pkg }}" --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
