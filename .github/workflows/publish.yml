name: Publish changed packages to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing — no NPM_TOKEN needed
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # No registry-url / NODE_AUTH_TOKEN: the OIDC flow needs npm's own
          # auth, and setup-node's registry-url interferes with the trigger.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Publish only packages whose local version differs from the latest
      # published npm version. Idempotent: an already-published version is
      # never re-published, and untouched packages are skipped. No tags needed.
      - name: Detect packages with a version bump
        id: detect
        run: |
          CHANGED=""
          for manifest in $(find packages -name package.json -not -path "*/node_modules/*"); do
            PKG_NAME=$(node -p "require('./$manifest').name // ''")
            PKG_VER=$(node -p "require('./$manifest').version // ''")
            [ -n "$PKG_NAME" ] || continue
            PKG_VER="${PKG_VER:-0.0.0}"
            LATEST=$(npm view "$PKG_NAME" version 2>/dev/null || echo "0.0.0")
            if [ "$PKG_VER" != "$LATEST" ]; then
              echo "  $PKG_NAME@$PKG_VER (registry: $LATEST)"
              CHANGED="$CHANGED $PKG_NAME"
            fi
          done
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          [ -z "$CHANGED" ] && echo "No version changes — nothing to publish."

      - name: Publish changed packages
        if: steps.detect.outputs.changed != ''
        run: |
          for pkg in ${{ steps.detect.outputs.changed }}; do
            echo "==> pnpm publish --filter $pkg"
            pnpm publish --filter "$pkg" --provenance --access public --no-git-checks
          done
