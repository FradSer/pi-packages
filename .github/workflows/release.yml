name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # changesets/action commits the version bump
      pull-requests: write # opens / updates the "Version Packages" PR
      id-token: write # OIDC trusted publishing for npm
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Bun installs, tests, and packs; npm publishes because only npm CLI
      # >= 11.5.1 can attach a provenance statement and use OIDC trusted
      # publishing, which `bun publish` does not implement.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.1"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Use the npm CLI that supports provenance and trusted publishing
        run: npm install --global npm@^11.5.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install pytest
        run: python3 -m pip install --disable-pip-version-check pytest pytest-xdist

      - name: Run quality gate
        run: bun run check

      # Standard changesets CLI: @changesets/cli applies the version bumps and
      # changelogs described by the pending changesets. `bun pm version` only
      # rewrites one manifest, so it cannot drive a changeset release.
      #
      # `bun install` after the bump refreshes the workspace versions recorded in
      # bun.lock: `bun pm pack` rewrites `workspace:*` from that lockfile, so a
      # stale lockfile would publish consumers pinned to the previous pi-kit.
      #
      # Publish is intentionally scoped: `changeset publish` / a recursive publish
      # would also sweep every never-published workspace package (code-context,
      # lark, matt-pocock, ...) because they carry version numbers. Only the
      # packages in PUBLISH_SCOPE are ever published here — keep it in sync
      # with what the user wants on npm.
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun x changeset version && bun install
          publish: bun scripts/publish-release.mjs
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      # changesets/action skips the publish script when it has no pending
      # changesets. This retry covers versioned packages that are newer than
      # npm after a partial publish or a merged version PR.
      - name: Retry publishing versioned packages
        if: github.ref == 'refs/heads/main' && steps.changesets.outputs.hasChangesets != 'true'
        run: bun scripts/publish-release.mjs
        env:
          NPM_CONFIG_PROVENANCE: "true"
