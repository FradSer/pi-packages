name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # changesets/action commits the version bump
      pull-requests: write # opens / updates the "Version Packages" PR
      id-token: write # OIDC trusted publishing for npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # pnpm version comes from package.json#packageManager — do not also
      # pass `version:` here, pnpm/action-setup errors on double-specification.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Standard changesets CLI (pnpm 11's native `pnpm version -r` has a bug:
      # it reads change intents but does not apply the bump — verified locally,
      # see memory). @changesets/cli applies bumps correctly in this workspace.
      #
      # Publish is intentionally scoped: `changeset publish` / `pnpm publish -r`
      # would also sweep every never-published workspace package (code-context,
      # lark, mattpocock, ...) because they carry version numbers. Only the
      # packages in PUBLISH_SCOPE are ever published here — keep it in sync
      # with what the user wants on npm.
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm publish -r --provenance --access public --filter @fradser/pi-memory --filter @fradser/pi-btw --filter @fradser/pi-monitor --filter @fradser/pi-utils --filter @fradser/pi-vision --filter @fradser/pi-recap --filter pi-keyboard
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
